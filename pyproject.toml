[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signic-sdk"
version = "0.1.3"
description = "Python SDK for Signic email - sign in with Ethereum, read and manage emails"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "eth-account>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-httpx>=0.35,<1",
    "mypy>=1.11,<2",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signic_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["eth_account.*", "eth_account"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that hit real endpoints (deselect with '-m \"not integration\"')",
]
