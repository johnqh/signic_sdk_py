---
# CI/CD workflow for signic_sdk (Python)
# Automatically publishes to PyPI when PYPI_TOKEN is configured

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write      # For creating GitHub releases
  deployments: write   # For deployment tracking

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    with:
      python-version: "3.11"
      python-package-manager: "pip"
    secrets: inherit
